# omarchy-speak — Hyprland keybinds
# Source this from hyprland.conf:  source = ~/.config/hypr/speak.conf

# Primary action: speak whatever is highlighted, anywhere on the system.
# Press again while speaking to stop.
bindd = SUPER, R, Speak selection, exec, omarchy-speak-ctl toggle

# Same text, better voice. Slower to start.
bindd = SUPER SHIFT, R, Speak selection (kokoro), exec, omarchy-speak-ctl selection kokoro

# Read the clipboard rather than the selection.
bindd = SUPER ALT, R, Speak clipboard, exec, omarchy-speak-ctl clipboard

# Hard stop, for when you want silence without re-selecting.
bindd = SUPER SHIFT, ESCAPE, Stop speaking, exec, omarchy-speak-ctl stop

# Render the selection to ~/Audio/speak with kokoro.
bindd = SUPER SHIFT, S, Save selection as audio, exec, omarchy-speak-ctl save kokoro
